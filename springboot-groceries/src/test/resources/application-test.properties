spring.application.name=groceries-test

# ======================
# H2 CONFIG
# ======================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Let Flyway create/alter schema; Hibernate should validate only.
spring.jpa.hibernate.ddl-auto=validate

# ======================
# Flyway (H2)
# ======================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/common
spring.flyway.baseline-on-migrate=false

# The project ships repeatable seed migrations (R__seed_*.sql) that use
# PostgreSQL-only UPSERT syntax (ON CONFLICT). The test profile runs on H2,
# so we exclude repeatable migrations and only run versioned schema migrations.
spring.flyway.repeatable-sql-migration-prefix=DISABLED

# ======================
# Hibernate
# ======================
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
