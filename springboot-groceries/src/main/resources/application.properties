spring.application.name=groceries
server.port=8080

# ======================
# PostgreSQL CONFIG
# ======================
spring.datasource.url=jdbc:postgresql://localhost:5432/groceriesdb?options=-c%20timezone=Asia/Kolkata
spring.datasource.username=pguser
spring.datasource.password=pgpass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

# ======================
# Flyway (Postgres)
# ======================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/postgresql

# ======================
# Hibernate
# ======================
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# ======================
# Misc
# ======================
spring.jackson.serialization.fail-on-empty-beans=false
management.endpoints.web.exposure.include=mappings
logging.level.org.springframework.security=DEBUG

server.servlet.session.cookie.same-site=None
server.servlet.session.cookie.secure=true

spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.connection-timeout=30000
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
spring.jpa.properties.hibernate.generate_statistics=false

