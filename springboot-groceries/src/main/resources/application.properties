spring.application.name=groceries
server.port=8080

# The URL must explicitly force the timezone during the handshake
spring.datasource.url=jdbc:postgresql://localhost:5432/groceriesdb?options=-c%20timezone=Asia/Kolkata
spring.datasource.username=pguser
spring.datasource.password=pgpass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true
# Hibernate specific timezone setting
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.connection-timeout=30000
server.servlet.session.cookie.same-site=Lax
server.servlet.session.cookie.secure=false
spring.jackson.serialization.fail-on-empty-beans=false
management.endpoints.web.exposure.include=mappings
logging.level.org.springframework.security=DEBUG
